<style>
  :root{
    /* ロゴ由来：黒檀のディスク × 磨いたシャンパンゴールド */
    --bg:#100f0e;
    --panel:#191817;
    --panel-2:#211f1c;
    --gold-hi:#f4e7cf;
    --gold:#c9ab7f;
    --gold-mid:#a98d63;
    --gold-dim:#6b583f;
    --text:#e7e2d8;
    --text-soft:#9c9488;
    --line:rgba(201,171,127,.16);
    --line-hard:rgba(201,171,127,.34);
    --metal:linear-gradient(100deg,#8a7350 0%,#f4e7cf 28%,#c9ab7f 48%,#f8eeda 68%,#8a7350 100%);
    --mincho:"Shippori Mincho B1",serif;
    --gothic:"Zen Kaku Gothic New",sans-serif;
    --mono:"JetBrains Mono",monospace;
    --roman:"Cinzel",serif;
    --sidebar:280px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth;scroll-padding-top:24px}
  body{
    background:var(--bg);color:var(--text);
    font-family:var(--gothic);font-size:15px;line-height:1.9;
    -webkit-font-smoothing:antialiased;
    background-image:
      radial-gradient(120% 70% at 50% -10%, rgba(201,171,127,.07), transparent 60%),
      radial-gradient(rgba(255,255,255,.018) 1px, transparent 1px);
    background-size:auto, 3px 3px;
    background-attachment:fixed, scroll;
  }
  ::selection{background:rgba(201,171,127,.28);color:#fff}
  code{font-family:var(--mono);font-size:.9em;background:rgba(201,171,127,.12);color:var(--gold-hi);padding:1px 5px;border-radius:2px}
  .metal{background:var(--metal);-webkit-background-clip:text;background-clip:text;color:transparent}

  .wrap{display:grid;grid-template-columns:var(--sidebar) minmax(0,1fr);max-width:1360px;margin:0 auto;padding:0 32px}

  /* ===== 目次 ===== */
  .toc{position:sticky;top:0;align-self:start;height:100dvh;padding:32px 24px 28px 0;border-right:1px solid var(--line);display:flex;flex-direction:column;gap:14px}
  .toc-brand{display:flex;align-items:center;gap:11px}
  .toc-brand img{width:38px;height:38px;flex:none}
  .toc-brand span{font-family:var(--roman);font-size:9px;letter-spacing:.24em;color:var(--text-soft);display:block}
  .toc-brand b{display:block;font-family:var(--mincho);font-weight:800;font-size:18px;letter-spacing:.06em;margin-top:1px}
  .search{position:relative}
  .search input{width:100%;padding:9px 11px 9px 30px;background:#1a1917;border:1px solid var(--line-hard);border-radius:2px;font-family:var(--gothic);font-size:13px;color:var(--text)}
  .search input::placeholder{color:#6f695f}
  .search input:focus{outline:1px solid var(--gold);outline-offset:1px;border-color:var(--gold-mid)}
  .search svg{position:absolute;left:9px;top:50%;transform:translateY(-50%);width:13px;height:13px;stroke:var(--gold-mid);fill:none;stroke-width:2}
  .toc-panel{flex:1;display:flex;flex-direction:column;gap:14px;min-height:0}
  .menu-btn{display:none}
  .toc-list{overflow-y:auto;flex:1;padding-right:6px}
  .toc-list::-webkit-scrollbar{width:4px}
  .toc-list::-webkit-scrollbar-thumb{background:var(--gold-dim);border-radius:2px}
  .toc-chapter{display:block;margin-top:16px;padding-bottom:5px;font-family:var(--mincho);font-weight:800;font-size:12px;letter-spacing:.1em;color:var(--gold);border-bottom:1px solid var(--line)}
  .toc-list a{display:block;padding:4px 0 4px 9px;margin-left:-11px;font-size:13px;line-height:1.5;color:var(--text-soft);text-decoration:none;border-left:2px solid transparent;transition:color .15s,border-color .15s}
  .toc-list a:hover{color:var(--gold-hi)}
  .toc-list a.on{color:var(--gold-hi);font-weight:700;border-left-color:var(--gold)}
  .toc-foot{font-family:var(--roman);font-size:9px;letter-spacing:.2em;color:var(--text-soft)}
  .btn-print{width:100%;margin-top:7px;padding:8px;background:transparent;border:1px solid var(--line-hard);border-radius:2px;font-family:var(--roman);font-size:9px;letter-spacing:.18em;color:var(--gold);cursor:pointer;transition:background .2s,color .2s}
  .btn-print:hover{background:var(--metal);color:#14120e;border-color:transparent}

  /* ===== 本文 ===== */
  main{padding:32px 0 40px 44px;min-width:0}
  .masthead{position:relative;padding-bottom:26px}
  .doc-meta,.masthead h1,.subtitle{padding-right:168px}   /* ロゴと重なる高さの要素だけ避ける */
  .masthead::after{content:"";position:absolute;left:0;right:0;bottom:0;height:3px;
    background:linear-gradient(90deg,transparent,var(--gold-mid) 12%,var(--gold-hi) 50%,var(--gold-mid) 88%,transparent) top/100% 1px no-repeat,
               linear-gradient(90deg,transparent,var(--gold-dim) 20%,var(--gold-mid) 50%,var(--gold-dim) 80%,transparent) bottom/100% 1px no-repeat}
  .doc-meta{display:flex;flex-wrap:wrap;gap:4px 22px;font-family:var(--mono);font-size:10px;letter-spacing:.12em;color:var(--text-soft)}
  .doc-meta b{color:var(--gold);font-weight:700}
  h1{font-family:var(--mincho);font-weight:800;font-size:clamp(38px,5.6vw,62px);line-height:1.15;letter-spacing:.04em;margin:12px 0 6px}
  .subtitle{font-family:var(--roman);font-size:11px;letter-spacing:.42em;color:var(--gold-mid)}
  .preamble{max-width:none;margin-top:20px;color:var(--text-soft);font-size:14px;line-height:2}
  .preamble strong{color:var(--gold-hi);font-weight:700}

  .emblem{position:absolute;right:0;top:2px;width:132px;height:132px;
    filter:drop-shadow(0 6px 22px rgba(0,0,0,.75));
    animation:emerge .8s cubic-bezier(.2,.8,.3,1) .15s both}
  @keyframes emerge{from{opacity:0;transform:scale(.86) rotate(-8deg)}to{opacity:1;transform:none}}

  /* 編 */
  .chapter{margin-top:56px;scroll-margin-top:20px}
  .chapter-head{display:flex;align-items:center;gap:13px;margin-bottom:6px}
  .chapter-no{font-family:var(--mincho);font-weight:800;font-size:12px;letter-spacing:.1em;color:#14120e;background:var(--metal);padding:4px 10px;border-radius:1px;flex:none}
  .chapter-head h2{font-family:var(--mincho);font-weight:800;font-size:24px;letter-spacing:.05em;background:var(--metal);-webkit-background-clip:text;background-clip:text;color:transparent}
  .chapter-head hr{flex:1;border:0;height:1px;background:linear-gradient(90deg,var(--gold-dim),transparent)}

  /* 節 */
  .sec{margin-top:28px;scroll-margin-top:20px}
  .sec-h{font-family:var(--mincho);font-weight:800;font-size:20px;letter-spacing:.04em;color:var(--gold-hi);padding-left:12px;margin-bottom:12px;position:relative}
  .sec-h::before{content:"";position:absolute;left:0;top:.18em;bottom:.18em;width:3px;background:var(--metal)}

  /* 条項 */
  .art{position:relative;background:var(--panel);border:1px solid var(--line);border-left:2px solid var(--gold-dim);border-radius:2px;padding:15px 18px;margin-bottom:9px;scroll-margin-top:20px;transition:border-color .2s,background .2s}
  .art:hover{border-left-color:var(--gold);background:var(--panel-2)}
  .art:target{border-left-color:var(--gold-hi);box-shadow:0 0 0 1px rgba(201,171,127,.35)}
  .art-top{display:flex;align-items:baseline;gap:9px}
  .art-no{font-family:var(--mono);font-size:12px;font-weight:700;color:var(--gold);flex:none}
  .art-top h4{font-family:var(--mincho);font-weight:800;font-size:16px;letter-spacing:.03em;color:var(--gold-hi)}
  .art p{margin-top:6px;font-size:14px;color:var(--text);max-width:72ch}
  .art ul{margin:6px 0 0 17px;font-size:14px;color:var(--text);max-width:72ch}
  .art li{margin-top:2px}
  .art li::marker{color:var(--gold-mid)}
  .art b{color:var(--gold-hi)}
  .art .ex{margin-top:7px;padding:9px 12px;background:rgba(201,171,127,.06);border-left:1px solid var(--gold-dim);border-radius:0 2px 2px 0;font-size:13px;color:var(--text-soft);max-width:72ch}
  .art .ex b{color:var(--gold)}
  .ban{color:#e0704f;font-weight:700}
  .art > p:first-child{margin-top:0}
  .art .lead{margin-top:0}

  /* 表 */
  .tbl{margin-top:9px;border-collapse:collapse;font-size:13.5px;width:100%;max-width:520px}
  .tbl th,.tbl td{border:1px solid var(--line);padding:6px 11px;text-align:left}
  .tbl th{background:rgba(201,171,127,.08);font-weight:700;color:var(--text)}
  .tbl td{color:var(--gold-hi)}
  .tbl td:last-child{font-family:var(--mono);text-align:right;white-space:nowrap}
  .tbl caption{text-align:left;font-size:12px;color:var(--gold-mid);padding-bottom:5px;letter-spacing:.04em}

  .copy{position:absolute;right:11px;bottom:9px;background:none;border:0;cursor:pointer;font-family:var(--roman);font-size:9px;letter-spacing:.14em;color:var(--text-soft);opacity:0;transition:opacity .15s,color .15s}
  .art:hover .copy,.copy:focus{opacity:1}
  .copy:hover{color:var(--gold-hi)}

  footer{margin-top:54px;padding-top:18px;border-top:1px solid var(--line);font-family:var(--roman);font-size:9px;letter-spacing:.22em;color:var(--text-soft);display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px}
  footer img{width:26px;height:26px;opacity:.85}
  .empty{display:none;padding:40px 0;text-align:center;color:var(--text-soft);font-size:14px}
  .empty.on{display:block}

  @media (max-width:880px){
    html{scroll-padding-top:76px}
    .wrap{grid-template-columns:1fr;padding:0 16px}

    /* 上部固定バー */
    .toc{
      position:sticky;top:0;z-index:60;height:auto;
      margin:0 -16px;padding:9px 16px;
      display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:10px;
      background:rgba(16,15,14,.94);
      -webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);
      border-right:0;border-bottom:1px solid var(--line);
    }
    .toc-brand{gap:0}
    .toc-brand img{width:32px;height:32px}
    .toc-brand div{display:none}          /* バー内はロゴのみ */
    .search input{padding:8px 11px 8px 30px}

    .menu-btn{
      display:block;flex:none;padding:8px 12px;
      background:transparent;border:1px solid var(--line-hard);border-radius:2px;
      font-family:var(--mincho);font-weight:800;font-size:12px;letter-spacing:.08em;
      color:var(--gold);cursor:pointer;white-space:nowrap;
    }
    .toc.open .menu-btn{background:var(--metal);color:#14120e;border-color:transparent}

    /* 目次はドロワーに */
    .toc-panel{
      position:fixed;left:0;right:0;top:58px;bottom:0;z-index:59;
      background:var(--bg);padding:18px 20px 32px;
      overflow-y:auto;gap:12px;
      opacity:0;transform:translateY(-6px);pointer-events:none;
      transition:opacity .18s,transform .18s;
    }
    .toc.open .toc-panel{opacity:1;transform:none;pointer-events:auto}
    .toc-list{max-height:none;overflow:visible;flex:none}
    .toc-list a{padding:8px 0 8px 9px}    /* タップしやすく */
    .toc-chapter{margin-top:20px}

    main{padding:24px 0}
    .doc-meta,.masthead h1,.subtitle{padding-right:100px}
    .emblem{width:88px;height:88px;top:0}
    .art{padding-bottom:30px}
    .tbl{max-width:none}
  }
  @media (hover:none){.copy{opacity:1}}
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}html{scroll-behavior:auto}}

  /* 印刷時は白地に反転（インク節約） */
  @media print{
    body{background:#fff;background-image:none;color:#111;font-size:10.5pt}
    .toc,.copy,.btn-print{display:none}
    .wrap{display:block;max-width:none;padding:0}
    main{padding:0}
    .doc-meta,.masthead h1,.subtitle{padding-right:0}
    h1,.chapter-head h2,.chapter-no{background:none;-webkit-text-fill-color:#111;color:#111}
    .chapter-no{border:1px solid #111}
    .sec-h,.art-top h4,.art b,.tbl td{color:#111}
    .art{background:#fff;border:1px solid #999;break-inside:avoid}
    .sec{break-inside:avoid}
    .tbl th{background:#eee}
    .doc-meta b,.subtitle,.tbl caption{color:#555}
  }
</style>
</head>

<script>
/* =========================================================
   ルールの中身は rules.json にあります。
   このファイル（index.html）は見た目だけを担当します。
   ルールを直すときは rules.json を編集してください。
   ========================================================= */

const RULES_URL = 'rules.json';

/* ---------- 描画 ---------- */
const block = b => {
  if (typeof b === 'string') return `<p>${b}</p>`;
  if (b.ban)  return `<p class="ban">${b.ban}</p>`;
  if (b.note) return `<div class="ex">${b.note}</div>`;
  if (b.list) return `<ul>${b.list.map(x => `<li>${x}</li>`).join('')}</ul>`;
  if (b.table){
    const t = b.table;
    const cap = t.caption ? `<caption>${t.caption}</caption>` : '';
    const rows = (t.rows || []).map(r =>
      '<tr>' + r.map((c, i) => i === 0 ? `<th>${c}</th>` : `<td>${c}</td>`).join('') + '</tr>'
    ).join('');
    return `<table class="tbl">${cap}${rows}</table>`;
  }
  return '';
};

const item = it => {
  const top = (it.no || it.title)
    ? `<div class="art-top">${it.no ? `<span class="art-no">${it.no}</span>` : ''}${it.title ? `<h4>${it.title}</h4>` : ''}</div>`
    : '';
  return `<article class="art">${top}${(it.body || []).map(block).join('')}</article>`;
};

const render = data => {
  const m = data.meta || {};
  if (m.siteTitle) document.title = m.siteTitle;
  if (m.title)     { document.getElementById('docTitle').textContent = m.title;
                     document.getElementById('footBrand').textContent = m.title; }
  if (m.subtitle)  document.getElementById('docSubtitle').textContent = m.subtitle;
  if (m.preamble)  document.getElementById('docPreamble').innerHTML = m.preamble;
  if (m.info) document.getElementById('docMeta').innerHTML =
    m.info.map(i => `<span>${i.label} <b>${i.value}</b></span>`).join('');

  document.getElementById('doc').innerHTML =
    (data.chapters || []).map(ch => `
      <section class="chapter" data-chapter="${ch.title}">
        <div class="chapter-head">
          <span class="chapter-no">${ch.label}</span><h2>${ch.title}</h2><hr>
        </div>
        ${(ch.sections || []).map(sec => `
          <div class="sec" data-sec="${sec.tocTitle || sec.title}">
            <h3 class="sec-h">${sec.title}</h3>
            ${(sec.items || []).map(item).join('')}
          </div>`).join('')}
      </section>`).join('')
    + '<p class="empty" id="empty">該当するルールはありません。</p>';
};

/* ---------- 目次・検索・ドロワー ---------- */
const init = () => {
  const doc = document.getElementById('doc');
  const chapters = [...doc.querySelectorAll('.chapter')];
  const secs = [...doc.querySelectorAll('.sec')];
  const arts = [...doc.querySelectorAll('.art')];

  chapters.forEach((ch, ci) => {
    ch.id = 'ch' + (ci + 1);
    ch.querySelectorAll('.sec').forEach((s, si) => {
      s.id = ch.id + '-' + (si + 1);
      s.querySelectorAll('.art').forEach((a, ai) => {
        a.id = s.id + '-' + (ai + 1);
        const b = document.createElement('button');
        b.className = 'copy';
        b.textContent = 'リンクをコピー';
        a.appendChild(b);
      });
    });
  });

  const list = document.getElementById('tocList');
  chapters.forEach(ch => {
    const h = document.createElement('span');
    h.className = 'toc-chapter';
    h.textContent = ch.dataset.chapter;
    list.appendChild(h);
    ch.querySelectorAll('.sec').forEach(s => {
      const a = document.createElement('a');
      a.href = '#' + s.id;
      a.dataset.for = s.id;
      a.textContent = s.dataset.sec;
      list.appendChild(a);
    });
  });
  const links = [...list.querySelectorAll('a')];

  const q = document.getElementById('q');
  const empty = document.getElementById('empty');
  q.addEventListener('input', () => {
    const t = q.value.trim().toLowerCase();
    let hits = 0;
    arts.forEach(a => {
      const m = !t || a.textContent.toLowerCase().includes(t);
      a.style.display = m ? '' : 'none';
      if (m) hits++;
    });
    secs.forEach(s => {
      const any = [...s.querySelectorAll('.art')].some(a => a.style.display !== 'none');
      s.style.display = any ? '' : 'none';
      const l = links.find(x => x.dataset.for === s.id);
      if (l) l.style.display = any ? '' : 'none';
    });
    chapters.forEach(ch => {
      const any = [...ch.querySelectorAll('.sec')].some(s => s.style.display !== 'none');
      ch.style.display = any ? '' : 'none';
    });
    empty.classList.toggle('on', hits === 0);
  });

  const spy = new IntersectionObserver(es => {
    es.forEach(e => {
      if (!e.isIntersecting) return;
      links.forEach(l => l.classList.toggle('on', l.dataset.for === e.target.id));
    });
  }, { rootMargin: '-8% 0px -75% 0px' });
  secs.forEach(s => spy.observe(s));

  const nav = document.querySelector('.toc');
  const menuBtn = document.getElementById('menuBtn');
  const setOpen = o => {
    nav.classList.toggle('open', o);
    menuBtn.setAttribute('aria-expanded', o);
    menuBtn.textContent = o ? '閉じる' : '目次';
    document.body.style.overflow = o ? 'hidden' : '';
  };
  menuBtn.addEventListener('click', () => setOpen(!nav.classList.contains('open')));
  links.forEach(l => l.addEventListener('click', () => setOpen(false)));
  q.addEventListener('focus', () => setOpen(false));
  document.addEventListener('keydown', e => { if (e.key === 'Escape') setOpen(false); });
  window.addEventListener('resize', () => { if (innerWidth > 880) setOpen(false); });

  doc.addEventListener('click', e => {
    const btn = e.target.closest('.copy');
    if (!btn) return;
    const url = location.href.split('#')[0] + '#' + btn.closest('.art').id;
    navigator.clipboard.writeText(url).then(() => {
      const old = btn.textContent;
      btn.textContent = 'コピーしました';
      setTimeout(() => btn.textContent = old, 1400);
    }).catch(() => { btn.textContent = 'コピーできません'; });
  });

  if (location.hash) {
    const el = document.querySelector(location.hash);
    if (el) el.scrollIntoView();
  }
};

/* ---------- 読み込み ---------- */
fetch(RULES_URL, { cache: 'no-cache' })
  .then(r => { if (!r.ok) throw new Error(r.status + ' ' + r.statusText); return r.json(); })
  .then(data => { render(data); init(); })
  .catch(err => {
    document.getElementById('doc').innerHTML = `
      <section class="chapter">
        <div class="chapter-head"><span class="chapter-no">ERROR</span><h2>ルールを読み込めません</h2><hr></div>
        <article class="art">
          <p><b>${err.message}</b></p>
          <p>考えられる原因：</p>
          <ul>
            <li><code>rules.json</code> が <code>index.html</code> と同じ場所にない</li>
            <li><code>rules.json</code> の書式が壊れている（カンマや引用符の消し忘れ）</li>
            <li>HTMLファイルをダブルクリックで直接開いている（ブラウザの制限で読み込めません。GitHub Pages 等に置くか、ローカルなら簡易サーバー経由で開いてください）</li>
          </ul>
        </article>
      </section>`;
  });
</script>
</body>
</html>
